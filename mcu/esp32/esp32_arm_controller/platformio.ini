; ESP32 Robot Arm Controller - Dual Mode (WiFi + BLE)
; PlatformIO configuration

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; 库依赖
lib_deps = 
    ; WebSocket 库
    Links2004/WebSockets@^2.4.1
    ; ESP32 Servo 库
    madhephaestus/ESP32Servo@^0.13.0

; 串口波特率
monitor_speed = 115200

; 上传速度
upload_speed = 921600
