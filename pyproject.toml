[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hardwire"
version = "0.1.0"
description = "Embedded SBC and Hardware Diagnostic Probe"
authors = [{ name = "muqiao" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
hardwire = "hardwire.cli:main"

[tool.setuptools.packages.find]
include = ["hardwire*"]

